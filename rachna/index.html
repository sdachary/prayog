<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rachna — Prayog</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="manifest" href="/site.webmanifest">
<link rel="stylesheet" href="/assets/theme.css">
<script src="../assets/nav.js" defer data-tool="rachna"></script>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  body{font-family:system-ui,-apple-system,sans-serif;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:1rem;background:var(--bg);color:var(--text)}
  .wrap{max-width:800px;width:100%}
  h1{font-size:1.3rem;font-weight:700;letter-spacing:0.02em;margin-bottom:1rem}
  h1 span{font-size:0.8rem;font-weight:400;color:var(--muted)}
  .toolbar{display:flex;gap:0.5rem;flex-wrap:wrap;align-items:center;margin-bottom:0.75rem}
  .toolbar label{font-size:0.75rem;color:var(--muted);font-family:monospace;text-transform:uppercase;letter-spacing:0.05em}
  select{padding:0.35rem 0.6rem;border-radius:var(--radius-sm);background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.12);color:var(--text);font-size:0.82rem}
  textarea{width:100%;height:300px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.1);border-radius:var(--radius-md);padding:0.75rem;color:var(--text);font-family:monospace;font-size:0.82rem;resize:vertical;line-height:1.5;tab-size:2}
  textarea:focus{outline:none;border-color:var(--amber)}
  .actions{display:flex;gap:0.5rem;margin:0.75rem 0;flex-wrap:wrap}
  .copy-msg{font-size:0.75rem;color:#4ade80;opacity:0;transition:opacity .3s;margin-left:0.5rem}
  .copy-msg.show{opacity:1}
  .visually-hidden{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
</style>
</head>
<body>
<div class="wrap">
  <h1>Rachna <span>formatter & converter</span></h1>
  <div class="toolbar">
    <label>input</label>
    <select id="inFmt">
      <option value="json">JSON</option>
      <option value="yaml">YAML</option>
      <option value="csv">CSV</option>
    </select>
    <label style="margin-left:0.5rem">output</label>
    <select id="outFmt">
      <option value="json">JSON</option>
      <option value="yaml" selected>YAML</option>
      <option value="csv">CSV</option>
    </select>
  </div>
  <div class="dropzone" id="dropzone" tabindex="0" role="button" aria-label="Drop a JSON, YAML, or CSV file, or press Enter to browse for one">Drop a JSON / YAML / CSV file, or paste below</div>
  <textarea id="input" placeholder="Paste your data here…" spellcheck="false"></textarea>
  <div class="error" id="error"></div>
  <div class="actions">
    <button class="btn btn-primary" id="convertBtn">convert</button>
    <button class="btn btn-secondary" id="copyBtn">copy result</button>
    <button class="btn btn-secondary" id="downloadBtn">download</button>
    <button class="btn btn-secondary" id="prettyBtn">pretty-print</button>
    <span class="copy-msg" id="copyMsg">copied</span>
  </div>
  <textarea id="output" placeholder="Result will appear here…" spellcheck="false" readonly style="height:200px;margin-top:0.5rem"></textarea>
  <footer>Nothing is uploaded or stored remotely — all processing happens in your browser.</footer>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.js"></script>
<script>
(function(){
  var input=document.getElementById('input'),output=document.getElementById('output');
  var err=document.getElementById('error'),inFmt=document.getElementById('inFmt'),outFmt=document.getElementById('outFmt');
  var dz=document.getElementById('dropzone');
  var fi=document.createElement('input');fi.type='file';fi.style.display='none';document.body.appendChild(fi);

  dz.onclick=function(){fi.click()};
  dz.onkeydown=function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();fi.click()}};
  dz.ondragover=function(e){e.preventDefault();dz.classList.add('dragover')};
  dz.ondragleave=function(){dz.classList.remove('dragover')};
  dz.ondrop=function(e){e.preventDefault();dz.classList.remove('dragover');readFile(e.dataTransfer.files[0])};
  fi.onchange=function(){readFile(this.files[0])};

  function readFile(f){
    if(!f)return;
    var ext=f.name.split('.').pop().toLowerCase();
    if(ext==='json')inFmt.value='json';else if(ext==='yaml'||ext==='yml')inFmt.value='yaml';else if(ext==='csv')inFmt.value='csv';
    var r=new FileReader();r.onload=function(){input.value=r.result};
    if(ext==='csv')r.readAsText(f);else r.readAsText(f);
  }

  function parseData(str,fmt){
    if(fmt==='json')return JSON.parse(str);
    if(fmt==='yaml')return jsyaml.load(str);
    if(fmt==='csv')return parseCSV(str);
  }

  function formatData(data,fmt,pretty){
    if(fmt==='json')return JSON.stringify(data,null,pretty?2:undefined);
    if(fmt==='yaml')return jsyaml.dump(data,{indent:2,lineWidth:-1,noRefs:true});
    if(fmt==='csv')return toCSV(data);
  }

  function parseCSV(s){
    var lines=s.trim().split('\n').filter(function(l){return l.trim()});
    if(!lines.length)return[];
    var headers=lines[0].split(',').map(function(h){return h.trim().replace(/^"|"$/g,'')});
    var out=[];
    for(var i=1;i<lines.length;i++){
      var vals=lines[i].split(',').map(function(v){return v.trim().replace(/^"|"$/g,'')});
      var row={};
      for(var j=0;j<headers.length;j++)row[headers[j]]=vals[j]||'';
      out.push(row);
    }
    return out;
  }

  function toCSV(data){
    if(!Array.isArray(data))data=[data];
    if(!data.length)return'';
    var keys=Object.keys(data[0]);
    var lines=[keys.map(function(k){return'"'+String(k).replace(/"/g,'""')+'"'}).join(',')];
    for(var i=0;i<data.length;i++){
      lines.push(keys.map(function(k){var v=data[i][k];return v==null?'':'"'+String(v).replace(/"/g,'""')+'"'}).join(','));
    }
    return lines.join('\n');
  }

  document.getElementById('convertBtn').onclick=function(){
    err.classList.remove('show');err.textContent='';
    try{
      var data=parseData(input.value,inFmt.value);
      output.value=formatData(data,outFmt.value,true);
    }catch(e){err.textContent=e.message;err.classList.add('show')}
  };

  document.getElementById('prettyBtn').onclick=function(){
    err.classList.remove('show');err.textContent='';
    try{
      var data=parseData(input.value,inFmt.value);
      output.value=formatData(data,inFmt.value,true);
    }catch(e){err.textContent=e.message;err.classList.add('show')}
  };

  document.getElementById('copyBtn').onclick=function(){
    if(!output.value)return;
    navigator.clipboard.writeText(output.value);
    var m=document.getElementById('copyMsg');m.classList.add('show');
    setTimeout(function(){m.classList.remove('show')},1500);
  };

  document.getElementById('downloadBtn').onclick=function(){
    if(!output.value)return;
    var a=document.createElement('a');a.href='data:text/plain;charset=utf-8,'+encodeURIComponent(output.value);
    a.download='output.'+outFmt.value; a.click();
  };
})();
</script>
</body>
</html>
