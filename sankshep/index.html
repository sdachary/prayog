<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sankshep — Prayog</title>
<meta name="description" content="Image compressor and resizer. Drop an image, adjust quality and dimensions, preview size, download.">

<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="manifest" href="/site.webmanifest">

<!-- Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,600&family=Geist+Mono:wght@400;500;600&family=Satoshi:wght@400;500;600;700&display=swap" rel="stylesheet">

<!-- Styles -->
<link rel="stylesheet" href="/assets/theme.css">
<link rel="stylesheet" href="/assets/tool.css">

<!-- Scripts -->
<script src="/assets/nav.js" defer data-tool="SANKSHEP"></script>
<script src="/assets/tool.js" defer></script>

<!-- Page-specific styles -->
<style>
  .img-row {
    display: grid;
    grid-template-columns: 1fr;
    gap: var(--tool-space-4);
    margin: var(--tool-space-4) 0;
  }
  @media (min-width: 640px) {
    .img-row { grid-template-columns: 1fr 1fr; }
  }
  .img-box {
    text-align: center;
    background: var(--tool-bg);
    border: 1px solid var(--tool-border);
    border-radius: var(--tool-radius-md);
    padding: var(--tool-space-3);
  }
  .img-box img,
  .img-box canvas {
    max-width: 100%;
    max-height: 300px;
    border-radius: var(--tool-radius-sm);
    display: block;
    margin: 0 auto var(--tool-space-2);
  }
  .img-label {
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--tool-text-muted);
    margin-bottom: var(--tool-space-1);
  }
  .img-size {
    font-family: var(--font-mono);
    font-size: 13px;
    font-weight: 600;
    color: var(--tool-amber);
  }

  .controls {
    display: flex;
    flex-direction: column;
    gap: var(--tool-space-3);
    margin: var(--tool-space-4) 0;
  }
  .ctrl-row {
    display: flex;
    align-items: center;
    gap: var(--tool-space-3);
  }
  .ctrl-row label {
    font-family: var(--font-mono);
    font-size: 12px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--tool-text-muted);
    min-width: 100px;
    flex-shrink: 0;
  }
  .ctrl-row input[type=range] {
    flex: 1;
    accent-color: var(--tool-amber);
  }
  .ctrl-row .val {
    font-family: var(--font-mono);
    font-size: 13px;
    font-weight: 600;
    color: var(--tool-amber);
    min-width: 60px;
    text-align: right;
  }
  .ctrl-row select {
    flex: 1;
    padding: var(--tool-space-2) var(--tool-space-3);
    border-radius: var(--tool-radius-md);
    background: var(--tool-surface);
    border: 1px solid var(--tool-border);
    color: var(--tool-text);
    font-family: var(--font-mono);
    font-size: 13px;
  }
  .ctrl-row select:focus { outline: none; border-color: var(--tool-teal); box-shadow: 0 0 0 3px rgba(47,163,154,0.15); }

  .visually-hidden {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
  }
</style>
</head>
<body>
<div class="tool-page">
  <div class="tool-wrap">
    <header class="tool-header">
      <h1 class="tool-brand">SANKSHEP<span class="tool-brand-mark">//</span></h1>
      <p class="tool-tagline">image compressor & resizer</p>
    </header>

    <main class="tool-main tool-main--narrow">

      <section class="tool-card">
        <div class="tool-dropzone" id="dropzone" tabindex="0" role="button" aria-label="Drop an image here, or press Enter to browse">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
          <div class="tool-dropzone-title">Drop an image here, or click to browse</div>
          <div class="tool-dropzone-hint">JPEG, PNG, WebP, GIF, AVIF supported</div>
        </div>
        <input type="file" id="fileInput" accept="image/*" class="tool-file-input">

        <div class="hidden" id="preview" aria-live="polite">
          <div class="img-row">
            <div class="img-box">
              <div class="img-label">original</div>
              <div id="origImage"></div>
              <div class="img-size" id="origSize">—</div>
            </div>
            <div class="img-box">
              <div class="img-label">compressed</div>
              <div id="compImage"></div>
              <div class="img-size" id="compSize">—</div>
            </div>
          </div>

          <div class="controls">
            <div class="ctrl-row">
              <label for="quality">Quality</label>
              <input type="range" id="quality" min="10" max="100" value="80" aria-label="Compression quality">
              <span class="val" id="qualityVal">80%</span>
            </div>
            <div class="ctrl-row">
              <label for="maxW">Max width</label>
              <input type="range" id="maxW" min="100" max="4000" value="1920" step="10" aria-label="Maximum width in pixels">
              <span class="val" id="maxWVal">1920px</span>
            </div>
            <div class="ctrl-row">
              <label for="format">Format</label>
              <select id="format" aria-label="Output format">
                <option value="image/jpeg">JPEG</option>
                <option value="image/webp" selected>WebP</option>
                <option value="image/png">PNG</option>
                <option value="image/avif">AVIF</option>
              </select>
            </div>
          </div>

          <button class="tool-btn tool-btn--primary tool-btn--full" id="downloadBtn" type="button" disabled>Download compressed image</button>
        </div>
      </section>

    </main>

    <footer class="tool-footer">
      Nothing is uploaded or stored remotely — all processing happens in your browser.
    </footer>
  </div>
</div>

<script>
(function(){
  'use strict';

  const dz = document.getElementById('dropzone');
  const fi = document.getElementById('fileInput');
  const pv = document.getElementById('preview');
  const origImageEl = document.getElementById('origImage');
  const origSizeEl = document.getElementById('origSize');
  const compImageEl = document.getElementById('compImage');
  const compSizeEl = document.getElementById('compSize');
  const q = document.getElementById('quality');
  const qv = document.getElementById('qualityVal');
  const mw = document.getElementById('maxW');
  const mwv = document.getElementById('maxWVal');
  const fmt = document.getElementById('format');
  const dl = document.getElementById('downloadBtn');

  let _img = null, _origFile = null, _blob = null;

  function formatSize(b) {
    if (!b) return '—';
    if (b < 1024) return b + ' B';
    if (b < 1048576) return (b / 1024).toFixed(1) + ' KB';
    return (b / 1048576).toFixed(1) + ' MB';
  }

  function updateVal() {
    qv.textContent = q.value + '%';
    q.setAttribute('aria-valuetext', q.value + '%');
    mwv.textContent = mw.value + 'px';
    mw.setAttribute('aria-valuetext', mw.value + ' pixels');
  }

  q.oninput = () => { updateVal(); render(); };
  mw.oninput = () => { updateVal(); render(); };
  fmt.onchange = render;

  // Dropzone
  dz.onclick = () => fi.click();
  dz.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); fi.click(); } };
  dz.ondragover = e => { e.preventDefault(); dz.classList.add('drag'); };
  dz.ondragleave = () => dz.classList.remove('drag');
  dz.ondrop = e => { e.preventDefault(); dz.classList.remove('drag'); load(e.dataTransfer.files[0]); };
  fi.onchange = () => { load(fi.files[0]); fi.value = ''; };

  function load(f) {
    if (!f || !f.type.match(/image\//)) return;
    _origFile = f;
    const r = new FileReader();
    r.onload = () => {
      const i = new Image();
      i.onload = () => { _img = i; show(); };
      i.src = r.result;
    };
    r.readAsDataURL(f);
  }

  function show() {
    origImageEl.innerHTML = '';
    const origImg = _img.cloneNode();
    origImg.style.maxHeight = '300px';
    origImg.alt = 'Original image preview';
    origImageEl.appendChild(origImg);
    origSizeEl.textContent = formatSize(_origFile.size);
    pv.classList.remove('hidden');
    dl.disabled = false;
    render();
  }

  function render() {
    if (!_img) return;
    const c = document.createElement('canvas');
    const ctx = c.getContext('2d');
    let w = _img.naturalWidth, h = _img.naturalHeight;
    const m = parseInt(mw.value);
    if (w > m) { h = (h * m / w) | 0; w = m; }
    c.width = w; c.height = h;
    ctx.drawImage(_img, 0, 0, w, h);

    const qv2 = parseInt(q.value) / 100;
    const f = fmt.value;

    c.toBlob(blob => {
      if (!blob) return;
      _blob = blob;
      compImageEl.innerHTML = '';
      const ci = new Image();
      ci.src = URL.createObjectURL(blob);
      ci.style.maxHeight = '300px';
      ci.alt = 'Compressed image preview';
      compImageEl.appendChild(ci);
      compSizeEl.textContent = formatSize(blob.size);

      dl.onclick = () => {
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        const ext = f.split('/')[1];
        a.download = 'compressed.' + ext;
        a.click();
        showToast('Downloaded: compressed.' + ext, 'success');
      };
    }, f, qv2);
  }

  updateVal();
})();
</script>
</body>
</html>
