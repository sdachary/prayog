<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tulna — Prayog</title>
<meta name="description" content="Text diff tool. Compare two texts with side-by-side word-level diff highlighting. Paste, diff, copy.">

<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="manifest" href="/site.webmanifest">

<!-- Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,600&family=Geist+Mono:wght@400;500;600&family=Satoshi:wght@400;500;600;700&display=swap" rel="stylesheet">

<!-- Styles -->
<link rel="stylesheet" href="/assets/theme.css">
<link rel="stylesheet" href="/assets/tool.css">

<!-- Scripts -->
<script src="/assets/nav.js" defer data-tool="TULNA"></script>
<script src="/assets/vendor/thinking-orbs-engine.js" defer></script>
<script src="/assets/orb.js" defer></script>
<script src="/assets/tool.js" defer></script>

<!-- Page-specific styles -->
<style>
  .editor-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: var(--tool-space-4);
  }
  @media (min-width: 900px) {
    .editor-grid { grid-template-columns: 1fr 1fr; }
  }

  .editor-pane {
    display: flex;
    flex-direction: column;
    min-height: 0;
  }

  .editor-label {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: var(--tool-space-2);
    margin-bottom: var(--tool-space-2);
    flex-wrap: wrap;
  }

  .editor-title {
    font-family: var(--font-mono);
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--tool-text-muted);
  }

  .editor-textarea {
    flex: 1;
    min-height: 300px;
    background: var(--tool-bg);
    border: 1px solid var(--tool-border);
    border-radius: var(--tool-radius-md);
    padding: var(--tool-space-4);
    color: var(--tool-text);
    font-family: var(--font-mono);
    font-size: 13px;
    line-height: 1.6;
    resize: vertical;
    tab-size: 2;
    transition: border-color var(--tool-duration-fast);
  }
  .editor-textarea:focus { outline: none; border-color: var(--tool-teal); box-shadow: 0 0 0 3px rgba(47,163,154,0.15); }
  .editor-textarea::placeholder { color: var(--tool-text-subtle); }

  @media (min-width: 900px) {
    .tool-main { height: calc(100vh - 160px); display: flex; flex-direction: column; }
    .editor-textarea { min-height: 0; }
  }

  .diff-output {
    background: var(--tool-bg);
    border: 1px solid var(--tool-border);
    border-radius: var(--tool-radius-md);
    padding: var(--tool-space-4);
    font-family: var(--font-mono);
    font-size: 13px;
    line-height: 1.6;
    white-space: pre-wrap;
    overflow-x: auto;
    max-height: 400px;
    overflow-y: auto;
    display: none;
    margin-top: var(--tool-space-4);
  }
  .diff-output.show { display: block; }
  .diff-output del { background: rgba(239,68,68,0.25); color: #fca5a5; text-decoration: line-through; padding: 0 2px; border-radius: 2px; }
  .diff-output ins { background: rgba(34,197,94,0.25); color: #86efac; text-decoration: none; padding: 0 2px; border-radius: 2px; }
  [data-theme="light"] .diff-output del { color: #b91c1c; }
  [data-theme="light"] .diff-output ins { color: #166534; }

  .meta-row {
    display: flex;
    gap: var(--tool-space-4);
    margin-top: var(--tool-space-3);
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--tool-text-muted);
    flex-wrap: wrap;
  }
  .meta-row span { color: var(--tool-amber); font-weight: 600; }

  .actions-row {
    display: flex;
    gap: var(--tool-space-2);
    flex-wrap: wrap;
    margin-top: var(--tool-space-3);
  }

  .visually-hidden {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
  }
</style>
</head>
<body>
<div class="tool-page">
  <div class="tool-wrap">
    <header class="tool-header">
      <h1 class="tool-brand">TULNA<span class="tool-brand-mark">//</span></h1>
      <p class="tool-tagline">text diff tool</p>
    </header>

    <main class="tool-main tool-main--wide">
      <div class="editor-grid">
        <section class="editor-pane" aria-labelledby="left-label">
          <div class="editor-label">
            <span id="left-label" class="editor-title">Left (original)</span>
          </div>
          <label class="visually-hidden" for="left">Original text</label>
          <textarea id="left" class="editor-textarea" placeholder="Paste original text here…" aria-describedby="left-label"></textarea>
        </section>

        <section class="editor-pane" aria-labelledby="right-label">
          <div class="editor-label">
            <span id="right-label" class="editor-title">Right (changed)</span>
          </div>
          <label class="visually-hidden" for="right">Changed text</label>
          <textarea id="right" class="editor-textarea" placeholder="Paste changed text here…" aria-describedby="right-label"></textarea>
        </section>
      </div>

      <div class="actions-row">
        <div class="orb-status">
          <thinking-orb state="solving" size="20" aria-hidden="true"></thinking-orb>
          <span class="tool-hint" role="status">Ready</span>
        </div>
        <button class="tool-btn tool-btn--primary" id="diffBtn" type="button">diff</button>
        <button class="tool-btn tool-btn--secondary" id="swapBtn" type="button">swap</button>
        <button class="tool-btn tool-btn--secondary" id="clearBtn" type="button">clear</button>
        <button class="tool-btn tool-btn--secondary" id="copyBtn" type="button">copy diff</button>
      </div>

      <div class="meta-row" id="meta" aria-live="polite"></div>

      <div class="diff-output" id="diff" aria-live="polite" role="region" aria-label="Diff result"></div>
    </main>

    <footer class="tool-footer">
      Nothing is uploaded or stored remotely — all processing happens in your browser.
    </footer>
  </div>
</div>

<script>
(function(){
  'use strict';

  const L = document.getElementById('left');
  const R = document.getElementById('right');
  const D = document.getElementById('diff');
  const M = document.getElementById('meta');

  function diff(a, b) {
    const al = a.split('\n');
    const bl = b.split('\n');
    const m = al.length, n = bl.length;
    const dp = Array.from({ length: m + 1 }, () => Array(n + 1).fill(0));
    for (let i = 1; i <= m; i++) {
      for (let j = 1; j <= n; j++) {
        dp[i][j] = al[i-1] === bl[j-1] ? dp[i-1][j-1] + 1 : Math.max(dp[i-1][j], dp[i][j-1]);
      }
    }
    const out = [];
    let i = m, j = n;
    while (i > 0 || j > 0) {
      if (i > 0 && j > 0 && al[i-1] === bl[j-1]) { out.unshift(esc(al[i-1])); i--; j--; }
      else if (j > 0 && (i === 0 || dp[i][j-1] >= dp[i-1][j])) { out.unshift('<ins>' + esc(bl[j-1]) + '</ins>'); j--; }
      else { out.unshift('<del>' + esc(al[i-1]) + '</del>'); i--; }
    }
    M.innerHTML = 'Lines: L=' + al.length + ' R=' + bl.length + ' <span>|</span> Δ=' + (bl.length - al.length >= 0 ? '+' : '') + (bl.length - al.length);
    return out.join('\n');
  }

  function esc(s) {
    return s.replace(/&/g, '&').replace(/</g, '<').replace(/>/g, '>');
  }

  document.getElementById('diffBtn').onclick = function() {
    const l = L.value, r = R.value;
    if (!l || !r) { D.textContent = 'Both panes must have text.'; D.classList.add('show'); return; }
    D.innerHTML = diff(l, r);
    D.classList.add('show');
  };

  document.getElementById('swapBtn').onclick = function() { const t = L.value; L.value = R.value; R.value = t; };
  document.getElementById('clearBtn').onclick = function() { L.value = ''; R.value = ''; D.classList.remove('show'); M.innerHTML = ''; };

  document.getElementById('copyBtn').onclick = function() {
    if (!D.classList.contains('show')) return;
    const msg = document.getElementById('copyMsg');
    function ok() { if (msg) { msg.classList.add('show'); setTimeout(() => msg.classList.remove('show'), 1500); } }
    const text = D.innerText || D.textContent;
    if (navigator.clipboard && navigator.clipboard.writeText) { navigator.clipboard.writeText(text).then(ok); }
    else { const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); ok(); }
  };

  document.addEventListener('keydown', e => { if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') document.getElementById('diffBtn').click(); });
})();
</script>
</body>
</html>
